{% extends "base/index.html" %}	

{% block body %}

<h3>Comprobantes</h3>
<div class="row">
        <div class="col-lg-10">
                <a href="{% url 'contabilidad:nuevocomprobante' %}" class="btn btn-primary">
                        Crear
                </a>
        </div>
</div>
<hr/>
<div class="row">
        <div class="col-lg-12">
                <table id="tabla" class="display" cellspacing="0" width="100%">
                        <thead>
                                <tr>
                                        <th class="text-center">PROVEEDOR</th>
                                        <th class="text-center">FECHA</th>
                                        <th class="text-center">ACCIONES</th>
                                </tr>
                        </thead>
                        <tbody>
                        {% for comprobante in comprobantes %}
                <tr>
                    <td>{{ comprobante.nombre_cu }}</td>
                    <td>{{ comprobante.glosa_indiv }}</td>
                    <td class="text-center">
                        <a href="#" class="btn">
                            <span class="glyphicon glyphicon-eye-open"></span>
                        </a>
                        <a href="#" class="btn">
                            <span class="glyphicon glyphicon-edit"></span>
                        </a>
                    </td>
                                </tr>
                        {% endfor %}
                        </tbody>
                </table>
        </div>
</div>

{% endblock body %}
